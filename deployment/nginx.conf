# Nginx Configuration for qp-gen Production Deployment
# Place in /etc/nginx/sites-available/qp-gen and symlink to /etc/nginx/sites-enabled/

# 1. Frontend Server Block (Next.js Reverse Proxy)
server {
    listen 80;
    server_name qp.example.com; # Replace with your actual domain

    # Redirect HTTP to HTTPS in production
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name qp.example.com; # Replace with your actual domain

    # SSL Certificates (managed via Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/qp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Next.js Static Cache Optimization
    location /_next/static/ {
        alias /home/ubuntu/qp-gen/frontend/.next/static/;
        expires 365d;
        access_log off;
    }

    location / {
        proxy_pass http://localhost:3000; # Next.js production server
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Backend Server Block (Django Gunicorn Reverse Proxy)
server {
    listen 80;
    server_name api.qp.example.com; # Replace with your actual backend API domain

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.qp.example.com; # Replace with your actual backend API domain

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/api.qp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.qp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Static and Media Roots
    location /static/ {
        alias /home/ubuntu/qp-gen/backend/static/;
        expires 30d;
        access_log off;
    }

    # Stable media resolver (S3 presigned redirect or local filesystem streaming)
    location /media/ {
        proxy_pass http://unix:/run/qp-gen.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE streaming configuration (CRITICAL: disable buffering)
    #
    # Regex location so it covers BOTH streaming endpoints. `paper-from-bank`
    # streams the same SSE contract and was previously served by the generic
    # /api/ block, where proxy_buffering stayed on — events arrived only when
    # the whole generation finished.
    #
    # If a deployment replaces this file with a single `location /` block,
    # these three settings must move there or generation breaks in exactly one
    # way: the connection dies partway through with no error. The backend also
    # sends `X-Accel-Buffering: no` and a keepalive ping every 15s, which
    # together cover a proxy that has not been told about these paths — but
    # proxy_read_timeout still has to exceed the longest generation.
    location ~ ^/api/generation/(questions/stream|paper-from-bank)$ {
        proxy_pass http://unix:/run/qp-gen.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable Nginx proxy buffering for streaming events
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        # Must exceed the longest generation AND gunicorn's --timeout.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Standard API endpoints routing
    location /api/ {
        proxy_pass http://unix:/run/qp-gen.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
